debug: true
server:
  port: 9091
spring:
  application:
    name: SSA-WEB-API

  boot:
    admin:
      client:
        url: http://localhost:9999

#  config:
#    import: "optional:configserver:"

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

    env:
      enabled: true
      show-values: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
