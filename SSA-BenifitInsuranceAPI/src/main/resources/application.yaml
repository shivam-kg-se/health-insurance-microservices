spring:
  application:
    name: SSA-BenifitInsuranceAPI

  boot:
    admin:
      client:
        url: http://localhost:9999

  config:
    import: "optional:configserver:"

  batch:
    job:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always
    env:
      enabled: true
      show-values: always

server:
  port: 7076

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

debug: true